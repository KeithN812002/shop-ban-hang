# Lefthook Git Hooks Configuration
# Docs: https://github.com/evilmartians/lefthook

# Pre-commit: Chạy trước khi commit
pre-commit:
    parallel: true
    commands:
        prettier:
            glob: '*.{js,ts,cjs,mjs,jsx,tsx,json,css,scss,md,yaml,yml}'
            run: npx prettier --write {staged_files}
            stage_fixed: true
        eslint:
            glob: '*.{js,ts,jsx,tsx}'
            run: pnpm turbo lint --filter="[HEAD^1]"
            stage_fixed: false

# Pre-push: Chạy trước khi push
pre-push:
    parallel: true
    commands:
        type-check:
            run: pnpm turbo check-types
            fail_text: '❌ Type check failed! Please fix TypeScript errors before pushing.'

