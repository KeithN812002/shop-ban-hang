apiVersion: apps/v1
kind: Deployment
metadata:
    name: web
    namespace: default
    labels:
        app: web
        version: v1
spec:
    replicas: 3
    selector:
        matchLabels:
            app: web
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
    template:
        metadata:
            labels:
                app: web
                version: v1
        spec:
            containers:
                - name: web
                  image: web:latest
                  imagePullPolicy: IfNotPresent
                  ports:
                      - name: http
                        containerPort: 80
                        protocol: TCP
                  env:
                      - name: VITE_API_BASE_URL
                        valueFrom:
                            configMapKeyRef:
                                name: web-config
                                key: api-base-url
                      - name: VITE_SSO_URL
                        valueFrom:
                            configMapKeyRef:
                                name: web-config
                                key: sso-url
                      - name: VITE_CLIENT_ID
                        valueFrom:
                            configMapKeyRef:
                                name: web-config
                                key: client-id
                      - name: VITE_REALM
                        valueFrom:
                            configMapKeyRef:
                                name: web-config
                                key: realm
                  resources:
                      requests:
                          memory: '128Mi'
                          cpu: '100m'
                      limits:
                          memory: '512Mi'
                          cpu: '500m'
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 80
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      successThreshold: 1
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 80
                      initialDelaySeconds: 5
                      periodSeconds: 5
                      timeoutSeconds: 3
                      successThreshold: 1
                      failureThreshold: 3
            restartPolicy: Always
            terminationGracePeriodSeconds: 30
