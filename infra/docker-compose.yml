# Local development infrastructure for the shop platform.
# Run from this folder:  docker compose up -d
# Secrets come from infra/.env (git-ignored). Copy infra/.env.example and fill every key.
name: shop-infra

services:
  postgres:
    image: postgres:17.9
    container_name: shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in infra/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # *.sql / *.sh files run in name order, only when the data volume is empty (first start or after reset).
      - ../db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.12-alpine
    container_name: shop-redis
    restart: unless-stopped
    # No password: backend config sets redis.client-secret to an empty string.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  consul:
    image: hashicorp/consul:1.22.7
    container_name: shop-consul
    restart: unless-stopped
    # Dev agent keeps the KV store in memory: re-run scripts/load-consul-config after every restart of this container.
    command: ["agent", "-dev", "-client=0.0.0.0"]
    ports:
      - "127.0.0.1:8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: shop-keycloak
    restart: unless-stopped
    # start-dev: HTTP, embedded H2 database (kept in the keycloak-data volume). Not for production.
    # --import-realm: imports /opt/keycloak/data/import/*.json; skipped when the realm already exists.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set KEYCLOAK_ADMIN_USER in infra/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in infra/.env}
      KC_HEALTH_ENABLED: "true"
      # Resolved by the ${KEYCLOAK_CLIENT_SECRET} placeholder inside realm-shop.json.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set KEYCLOAK_CLIENT_SECRET in infra/.env}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-shop.json:/opt/keycloak/data/import/realm-shop.json:ro
    healthcheck:
      # The Keycloak image has no curl; probe the management port (9000) with bash /dev/tcp.
      test:
        - "CMD-SHELL"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  minio:
    # MinIO stopped publishing official community images (Docker Hub / Quay). Default is the community fork
    # pgsty/minio; override MINIO_IMAGE in infra/.env to use another S3-compatible image you trust.
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    container_name: shop-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    # One-shot: waits for MinIO, creates the private bucket `shop`, exits. Re-runs are safe (--ignore-existing).
    image: ${MC_IMAGE:-pgsty/mc:RELEASE.2026-10-26T00-00-00Z}
    container_name: shop-minio-init
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/.env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          echo "waiting for minio..."; sleep 2
        done
        mc mb --ignore-existing local/shop
        echo "bucket shop ready"

volumes:
  postgres-data:
  redis-data:
  keycloak-data:
  minio-data:
